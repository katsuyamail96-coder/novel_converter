<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小説設定 名前変換</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --button: #eef2ff;
      --button-hover: #e0e7ff;
      --primary: #4f46e5;
      --primary-text: #ffffff;
      --danger: #fff1f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 10px;
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 52vh;
      resize: vertical;
      padding: 14px;
      font-size: 16px;
      line-height: 1.6;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      color: var(--text);
      outline: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15), 0 8px 20px rgba(0,0,0,0.04);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 10px;
      font-size: 16px;
      font-weight: 700;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary);
    }

    .primary:hover {
      filter: brightness(0.96);
    }

    .status {
      margin-top: 10px;
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .buttons {
        grid-template-columns: repeat(2, 1fr);
      }

      textarea {
        min-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>小説設定 名前変換</h1>
    <p class="sub">本文中の「ユイ」「ルナ」「ジェネ」「クロ」を、押した名前にまとめて置換します。</p>

    <textarea id="text" placeholder="ここに小説設定やプロットを貼り付け"></textarea>

    <div class="buttons">
      <button type="button" onclick="replaceName('ユイ')">ユイ</button>
      <button type="button" onclick="replaceName('ルナ')">ルナ</button>
      <button type="button" onclick="replaceName('ジェネ')">ジェネ</button>
      <button type="button" onclick="replaceName('クロ')">クロ</button>
      <button type="button" class="primary" onclick="copyText()">コピー</button>
      <button type="button" class="primary" onclick="pasteText()">ペースト</button>
    </div>

    <div class="status" id="status"></div>
    <div class="footer">
      クリップボード操作は、Safari/Chromeの権限確認が出る場合があります。うまく動かない時は、手動でコピー＆ペーストしてください。
    </div>
  </main>

  <script>
    const names = ["ユイ", "ルナ", "ジェネ", "クロ"];
    const textarea = document.getElementById("text");
    const statusEl = document.getElementById("status");

    function setStatus(message) {
      statusEl.textContent = message;
      window.clearTimeout(window.__statusTimer);
      window.__statusTimer = window.setTimeout(() => {
        statusEl.textContent = "";
      }, 2200);
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function replaceName(targetName) {
      const before = textarea.value;
      if (!before) {
        setStatus("テキストが空です。");
        textarea.focus();
        return;
      }

      const pattern = new RegExp(names.map(escapeRegExp).join("|"), "g");
      const after = before.replace(pattern, targetName);
      const changed = before !== after;

      textarea.value = after;
      textarea.focus();

      if (changed) {
        setStatus(`名前を「${targetName}」に置換しました。`);
      } else {
        setStatus("置換対象の名前が見つかりませんでした。");
      }
    }

    async function copyText() {
      try {
        await navigator.clipboard.writeText(textarea.value);
        setStatus("コピーしました。");
      } catch (error) {
        textarea.select();
        document.execCommand("copy");
        setStatus("コピーしました。");
      }
    }

    async function pasteText() {
      try {
        const text = await navigator.clipboard.readText();
        textarea.value = text;
        textarea.focus();
        setStatus("ペーストしました。");
      } catch (error) {
        setStatus("自動ペーストできませんでした。長押し/⌘Vで貼り付けてください。");
        textarea.focus();
      }
    }
  </script>
</body>
</html>
